<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lincoln FC — Pedido de Uniformes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          'lfc-red':'#BD202F','lfc-navy':'#193560',
          'lfc-slate':'#6A7B95','lfc-charcoal':'#20242A',
          'lfc-yellow':'#F5BB18','lfc-blue':'#004A8F'
        },
        fontFamily: {
          'barlow': ['"Barlow Condensed"','sans-serif'],
          'montserrat': ['Montserrat','sans-serif']
        }
      }}
    }
  </script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-lfc-charcoal min-h-screen font-montserrat">

  <div id="header-root"></div>

  <main class="max-w-3xl mx-auto px-4 py-6">

    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-white font-barlow font-bold text-3xl uppercase tracking-wide leading-none">Uniformes</h1>
        <p class="text-lfc-slate text-xs mt-1">Pedido de tallas y dorsales por equipo</p>
      </div>
    </div>

    <div id="loading" class="flex justify-center py-12"><div class="spinner"></div></div>

    <!-- Tabs por equipo -->
    <div id="tabs-bar" class="hidden flex-wrap gap-2 mb-5"></div>

    <div id="equipos-container"></div>

    <div id="vacio" class="hidden text-center py-12 text-lfc-slate text-sm">
      No tienes equipos asignados.
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>

  <script>
  const TALLAS = ['4','6','8','10','12','14','XS','S','M','L','XL','XXL','3XL'];

  function cat2027FromAnio(anio) {
    if (!anio) return '—';
    const edad = 2027 - Number(anio);
    if (edad <=  9) return 'Sub 9';
    if (edad <= 11) return 'Sub 11';
    if (edad <= 13) return 'Sub 13';
    if (edad <= 15) return 'Sub 15';
    if (edad <= 17) return 'Sub 17';
    return 'Sub 21';
  }

  let currentUser   = null;
  let equiposGlobal = [];

  auth.onAuthStateChanged(async (authUser) => {
    if (!authUser) {
      await auth.signInAnonymously();
      return; // onAuthStateChanged volverá a disparar con el usuario anónimo
    }

    let userData;
    if (authUser.isAnonymous) {
      userData = { uid: authUser.uid, rol: 'anonimo', nombre: 'Invitado' };
      renderHeaderAnonimo();
    } else {
      try {
        const snap = await db.collection('usuarios').doc(authUser.uid).get();
        if (!snap.exists || snap.data().activo === false) {
          await auth.signOut();
          window.location.href = 'index.html';
          return;
        }
        userData = { uid: authUser.uid, email: authUser.email, ...snap.data() };
        renderHeader(document.getElementById('header-root'), userData, 'Uniformes');
      } catch (e) {
        console.error(e);
        window.location.href = 'index.html';
        return;
      }
    }

    currentUser = userData;

    let equipos = await getEquipos();
    if (userData.rol !== 'admin' && userData.rol !== 'anonimo' && userData.equiposAsignados?.length) {
      equipos = equipos.filter(e => userData.equiposAsignados.includes(e.id));
    }

    document.getElementById('loading').classList.add('hidden');

    if (!equipos.length) {
      document.getElementById('vacio').classList.remove('hidden');
      return;
    }

    equiposGlobal = equipos;
    const container = document.getElementById('equipos-container');

    for (const eq of equipos) {
      const [jugadores, unifSnap] = await Promise.all([
        getJugadores(eq.id),
        db.collection('uniformes').doc(eq.id).get()
      ]);
      const pedido = unifSnap.exists ? (unifSnap.data().pedido || {}) : {};
      container.appendChild(renderSeccionEquipo(eq, jugadores, pedido));
    }

    setupTabs(equipos);
  });

  function renderHeaderAnonimo() {
    document.getElementById('header-root').innerHTML = `
      <header class="bg-lfc-navy border-b border-white/10 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded bg-lfc-red flex items-center justify-center shrink-0">
            <span class="text-white font-barlow font-bold text-sm leading-none">LFC</span>
          </div>
          <span class="text-white font-barlow font-bold text-lg tracking-wide leading-none">Uniformes</span>
        </div>
        <a href="index.html"
          class="text-lfc-slate hover:text-white text-xs font-semibold uppercase tracking-wider transition">
          Iniciar sesión
        </a>
      </header>`;
  }

  // ── Render sección por equipo ──────────────────────────────────
  function renderSeccionEquipo(eq, jugadores, pedido) {
    const completados = contarCompletados(jugadores, pedido);

    const sec = document.createElement('section');
    sec.id        = `sec-${eq.id}`;
    sec.className = 'bg-lfc-navy rounded-2xl p-4 hidden';
    sec.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-white font-barlow font-bold text-xl uppercase tracking-wide leading-none">${eq.nombre}</h2>
          <p id="contador-${eq.id}" class="text-lfc-slate text-xs mt-0.5">${completados}/${jugadores.length} completados</p>
        </div>
        <button onclick="guardarEquipo('${eq.id}')"
          class="text-lfc-yellow text-xs font-semibold uppercase tracking-wide hover:text-white transition">
          Guardar Todo
        </button>
      </div>
      <div class="overflow-auto max-h-[70vh]">
        <table class="text-xs min-w-[600px]">
          <thead class="sticky top-0 z-10">
            <tr class="text-lfc-slate uppercase tracking-wider border-b border-white/10 bg-lfc-navy">
              <th class="text-left py-2 pr-2 font-semibold bg-lfc-navy sticky left-0 z-20 whitespace-nowrap">Jugador</th>
              <th class="text-center py-2 px-1 font-semibold w-16 bg-lfc-navy">Cat.<br>Actual</th>
              <th class="text-center py-2 px-1 font-semibold w-16 bg-lfc-navy">Cat.<br>2027</th>
              <th class="text-center py-2 px-1 font-semibold w-14 bg-lfc-navy">Año<br>Nac.</th>
              <th class="text-center py-2 px-1 font-semibold w-20 bg-lfc-navy">Talla</th>
              <th class="text-center py-2 px-1 font-semibold w-12 bg-lfc-navy">#</th>
              <th class="py-2 pl-1 w-16 bg-lfc-navy"></th>
            </tr>
          </thead>
          <tbody id="tbody-${eq.id}"></tbody>
        </table>
      </div>`;

    const tbody = sec.querySelector(`#tbody-${eq.id}`);
    jugadores.forEach(j => tbody.appendChild(renderFila(eq, j, pedido[j.id] || {})));

    return sec;
  }

  // ── Render fila de jugador ─────────────────────────────────────
  function renderFila(eq, jugador, p) {
    const talla    = p.talla    || '';
    const dorsal   = p.dorsal  != null ? p.dorsal : '';
    const catActual = eq.nombre;
    const anioNac   = p.anioNac != null ? p.anioNac : '';
    const cat2027   = cat2027FromAnio(anioNac);

    const tallasOpts = TALLAS.map(t =>
      `<option value="${t}" ${talla === t ? 'selected' : ''}>${t}</option>`
    ).join('');

    const tr = document.createElement('tr');
    tr.className    = 'border-b border-white/5';
    tr.dataset.equipoId      = eq.id;
    tr.dataset.equipoNombre  = eq.nombre;
    tr.dataset.jugadorId     = jugador.id;
    tr.dataset.jugadorNombre = jugador.nombre;
    tr.dataset.catActual     = catActual;
    tr.dataset.origTalla     = talla;
    tr.dataset.origDorsal    = String(dorsal);
    tr.dataset.origAnio      = String(anioNac);
    tr.dataset.dirty         = 'false';

    tr.innerHTML = `
      <td class="py-2 pr-2 text-white font-medium leading-tight sticky left-0 bg-lfc-navy z-10 whitespace-nowrap">${jugador.nombre}</td>
      <td class="py-2 px-1 text-center">
        <span class="text-lfc-slate text-xs">${catActual}</span>
      </td>
      <td class="py-2 px-1 text-center">
        <span class="cat2027-val text-white text-xs font-medium">${cat2027}</span>
      </td>
      <td class="py-2 px-1">
        <input type="number" min="2000" max="2025" value="${anioNac}" placeholder="—"
          class="anio-inp bg-lfc-charcoal text-white rounded-lg px-1 py-1.5 text-xs text-center
                 border border-lfc-slate/20 focus:border-lfc-red focus:outline-none w-14">
      </td>
      <td class="py-2 px-1">
        <select class="talla-sel bg-lfc-charcoal text-white rounded-lg px-1.5 py-1.5 text-xs
                       border border-lfc-slate/20 focus:border-lfc-red focus:outline-none w-full">
          <option value="">—</option>
          ${tallasOpts}
        </select>
      </td>
      <td class="py-2 px-1">
        <input type="number" min="1" max="99" value="${dorsal}" placeholder="—"
          class="dorsal-inp bg-lfc-charcoal text-white rounded-lg px-1 py-1.5 text-xs text-center
                 border border-lfc-slate/20 focus:border-lfc-red focus:outline-none w-12">
      </td>
      <td class="py-2 pl-1 text-right">
        <button class="btn-guardar hidden bg-lfc-yellow hover:bg-yellow-400 text-lfc-charcoal
                       text-xs font-bold px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">
          Guardar
        </button>
        <span class="btn-ok hidden text-green-400 text-sm font-bold">✓</span>
      </td>`;

    const tallaSel   = tr.querySelector('.talla-sel');
    const dorsalInp  = tr.querySelector('.dorsal-inp');
    const cat2027Val = tr.querySelector('.cat2027-val');
    const anioInp    = tr.querySelector('.anio-inp');
    const btnGuardar = tr.querySelector('.btn-guardar');
    const btnOk      = tr.querySelector('.btn-ok');

    function checkDirty() {
      const dirty = tallaSel.value          !== tr.dataset.origTalla  ||
                    String(dorsalInp.value) !== tr.dataset.origDorsal ||
                    String(anioInp.value)   !== tr.dataset.origAnio;
      tr.dataset.dirty = dirty ? 'true' : 'false';
      btnGuardar.classList.toggle('hidden', !dirty);
      if (!dirty) btnOk.classList.add('hidden');
    }

    tallaSel.addEventListener('change', checkDirty);
    dorsalInp.addEventListener('input',  checkDirty);
    anioInp.addEventListener('input', () => {
      cat2027Val.textContent = cat2027FromAnio(anioInp.value);
      checkDirty();
    });

    btnGuardar.addEventListener('click', async () => {
      btnGuardar.textContent = '…';
      btnGuardar.disabled = true;
      const ok = await guardarJugador(tr);
      btnGuardar.disabled = false;
      btnGuardar.textContent = 'Guardar';
      if (ok) {
        btnGuardar.classList.add('hidden');
        btnOk.classList.remove('hidden');
        tr.dataset.dirty        = 'false';
        tr.dataset.origTalla    = tallaSel.value;
        tr.dataset.origDorsal   = String(dorsalInp.value);
        tr.dataset.origAnio     = String(anioInp.value);
        setTimeout(() => btnOk.classList.add('hidden'), 2000);
        actualizarContador(eq.id);
      }
    });

    return tr;
  }

  // ── Guardar un jugador ─────────────────────────────────────────
  async function guardarJugador(tr) {
    const { equipoId, equipoNombre, jugadorId, jugadorNombre, catActual } = tr.dataset;
    const talla    = tr.querySelector('.talla-sel').value;
    const dorsal   = tr.querySelector('.dorsal-inp').value;
    const anioNac  = tr.querySelector('.anio-inp').value;
    const cat2027  = cat2027FromAnio(anioNac);

    const docRef = db.collection('uniformes').doc(equipoId);
    const updateData = {};
    updateData[`pedido.${jugadorId}`] = {
      nombre:    jugadorNombre,
      catActual: catActual,
      cat2027:   cat2027 !== '—' ? cat2027 : '',
      anioNac:   anioNac !== '' ? Number(anioNac) : null,
      talla:     talla,
      dorsal:    dorsal !== '' ? Number(dorsal) : null
    };
    updateData['actualizadoPor'] = currentUser.uid;
    updateData['ultimaEdicion']  = firebase.firestore.FieldValue.serverTimestamp();

    try {
      try {
        await docRef.update(updateData);
      } catch (e) {
        // El doc no existe todavía — crearlo primero
        await docRef.set({ equipo: equipoId, equipoNombre, pedido: {} });
        await docRef.update(updateData);
      }
      return true;
    } catch (e) {
      showToast('Error al guardar. Verifica tu conexión.', 'error');
      console.error(e);
      return false;
    }
  }

  // ── Guardar todos los pendientes de un equipo ──────────────────
  async function guardarEquipo(equipoId) {
    const filasDirty = [...document.querySelectorAll(
      `[data-equipo-id="${equipoId}"][data-dirty="true"]`
    )];
    if (!filasDirty.length) {
      showToast('No hay cambios pendientes.', 'info');
      return;
    }

    let guardados = 0;
    for (const tr of filasDirty) {
      const ok = await guardarJugador(tr);
      if (ok) {
        const tallaSel   = tr.querySelector('.talla-sel');
        const dorsalInp  = tr.querySelector('.dorsal-inp');
        const btnGuardar = tr.querySelector('.btn-guardar');
        const btnOk      = tr.querySelector('.btn-ok');

        tr.dataset.dirty       = 'false';
        tr.dataset.origTalla   = tallaSel.value;
        tr.dataset.origDorsal  = String(dorsalInp.value);
        tr.dataset.origAnio    = String(tr.querySelector('.anio-inp').value);
        btnGuardar.classList.add('hidden');
        btnOk.classList.remove('hidden');
        setTimeout(() => btnOk.classList.add('hidden'), 2000);
        guardados++;
      }
    }
    actualizarContador(equipoId);
    showToast(
      `${guardados} jugador${guardados !== 1 ? 'es' : ''} guardado${guardados !== 1 ? 's' : ''}.`,
      'success'
    );
  }

  // ── Actualizar contador de completados ─────────────────────────
  function actualizarContador(equipoId) {
    const filas = [...document.querySelectorAll(`[data-equipo-id="${equipoId}"]`)];
    const total       = filas.length;
    const completados = filas.filter(tr => {
      const talla  = tr.querySelector('.talla-sel').value;
      const dorsal = tr.querySelector('.dorsal-inp').value;
      return talla && dorsal;
    }).length;
    const label = document.getElementById(`contador-${equipoId}`);
    if (label) label.textContent = `${completados}/${total} completados`;
  }

  function contarCompletados(jugadores, pedido) {
    return jugadores.filter(j => {
      const p = pedido[j.id];
      return p && p.talla && (p.dorsal !== null && p.dorsal !== undefined && p.dorsal !== '');
    }).length;
  }

  // ── Tabs ───────────────────────────────────────────────────────
  function setupTabs(equipos) {
    const bar = document.getElementById('tabs-bar');
    bar.innerHTML = '';

    equipos.forEach((eq, i) => {
      const btn = document.createElement('button');
      btn.id          = `tab-btn-${eq.id}`;
      btn.textContent = eq.nombre;
      btn.className   = tabClass(i === 0);
      btn.onclick     = () => showTab(eq.id);
      bar.appendChild(btn);
    });

    bar.classList.remove('hidden');
    bar.classList.add('flex');

    // Mostrar solo el primero
    if (equipos.length) showTab(equipos[0].id);
  }

  function showTab(equipoId) {
    equiposGlobal.forEach(eq => {
      const sec = document.getElementById(`sec-${eq.id}`);
      const btn = document.getElementById(`tab-btn-${eq.id}`);
      const activo = eq.id === equipoId;
      sec?.classList.toggle('hidden', !activo);
      if (btn) btn.className = tabClass(activo);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function tabClass(activo) {
    return `shrink-0 px-4 py-2 rounded-xl font-barlow font-bold text-sm uppercase tracking-wide transition
      ${activo
        ? 'bg-lfc-red text-white'
        : 'bg-lfc-navy text-lfc-slate hover:text-white border border-lfc-slate/30'}`;
  }
  </script>
</body>
</html>
