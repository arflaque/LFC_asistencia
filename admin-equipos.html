<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lincoln FC — Equipos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          'lfc-red':'#BD202F','lfc-navy':'#193560',
          'lfc-slate':'#6A7B95','lfc-charcoal':'#20242A',
          'lfc-yellow':'#F5BB18','lfc-blue':'#004A8F'
        },
        fontFamily: {
          'barlow': ['"Barlow Condensed"','sans-serif'],
          'montserrat': ['Montserrat','sans-serif']
        }
      }}
    }
  </script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-lfc-charcoal min-h-screen font-montserrat">

  <div id="header-root"></div>

  <main class="max-w-lg mx-auto px-4 py-6">

    <!-- Inicializar datos (primera vez) -->
    <section class="bg-lfc-navy rounded-2xl p-5 mb-6">
      <h2 class="text-white font-barlow font-bold text-2xl uppercase tracking-wide mb-1">Datos Iniciales</h2>
      <p class="text-lfc-slate text-xs mb-4">Carga los equipos y jugadores base. Solo hacer una vez.</p>
      <button id="btn-seed"
        class="w-full bg-lfc-blue hover:bg-blue-800 text-white font-barlow font-bold text-lg uppercase tracking-widest py-3 rounded-xl transition">
        Inicializar Datos (Todos los equipos)
      </button>
      <div id="msg-seed" class="hidden mt-3 text-sm text-center"></div>
    </section>

    <!-- Crear equipo -->
    <section class="bg-lfc-navy rounded-2xl p-5 mb-6">
      <h2 class="text-white font-barlow font-bold text-2xl uppercase tracking-wide mb-4">Crear Equipo</h2>
      <div class="grid gap-3 mb-4">
        <div>
          <label class="block text-lfc-slate text-xs font-semibold uppercase tracking-widest mb-1.5">ID único</label>
          <input id="eq-id" type="text" placeholder="Ej: u17"
            class="w-full bg-lfc-charcoal text-white placeholder-lfc-slate/40 rounded-xl px-3 py-2.5 text-sm border border-lfc-slate/20 focus:border-lfc-red focus:outline-none">
        </div>
        <div>
          <label class="block text-lfc-slate text-xs font-semibold uppercase tracking-widest mb-1.5">Nombre</label>
          <input id="eq-nombre" type="text" placeholder="Ej: Sub 17"
            class="w-full bg-lfc-charcoal text-white placeholder-lfc-slate/40 rounded-xl px-3 py-2.5 text-sm border border-lfc-slate/20 focus:border-lfc-red focus:outline-none">
        </div>
      </div>
      <button id="btn-crear-eq"
        class="w-full bg-lfc-red hover:bg-red-700 text-white font-barlow font-bold text-xl uppercase tracking-widest py-3 rounded-xl transition">
        Crear Equipo
      </button>
      <div id="msg-eq" class="hidden mt-3 text-sm text-center"></div>
    </section>

    <!-- Lista de equipos y jugadores -->
    <section>
      <h2 class="text-white font-barlow font-bold text-2xl uppercase tracking-wide mb-3">Equipos</h2>
      <div id="loading-eq" class="flex justify-center py-6"><div class="spinner"></div></div>
      <div id="equipos-container" class="grid gap-4"></div>
    </section>

  </main>

  <!-- Modal jugador -->
  <div id="modal-jugador" class="hidden fixed inset-0 bg-black/70 flex items-end z-50">
    <div class="bg-lfc-navy w-full max-w-lg mx-auto rounded-t-2xl p-5">
      <h3 id="modal-titulo" class="text-white font-barlow font-bold text-2xl uppercase mb-4">Agregar Jugador</h3>
      <input type="hidden" id="j-equipo-id">
      <input type="hidden" id="j-jugador-id">
      <div class="mb-4">
        <label class="block text-lfc-slate text-xs font-semibold uppercase tracking-widest mb-1.5">Nombre completo</label>
        <input id="j-nombre" type="text" placeholder="Apellido Nombre"
          class="w-full bg-lfc-charcoal text-white placeholder-lfc-slate/40 rounded-xl px-3 py-2.5 text-sm border border-lfc-slate/20 focus:border-lfc-red focus:outline-none">
      </div>
      <div id="j-activo-wrap" class="hidden flex items-center gap-3 mb-4">
        <label class="text-lfc-slate text-xs font-semibold uppercase tracking-widest">Activo</label>
        <input id="j-activo" type="checkbox" checked class="w-4 h-4 accent-lfc-red">
      </div>
      <div class="flex gap-3">
        <button id="btn-guardar-j"
          class="flex-1 bg-lfc-red hover:bg-red-700 text-white font-barlow font-bold text-lg uppercase py-3 rounded-xl transition">
          Guardar
        </button>
        <button onclick="closeModalJ()"
          class="flex-1 bg-lfc-charcoal text-lfc-slate font-barlow font-bold text-lg uppercase py-3 rounded-xl transition hover:text-white">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>

  <script>
    function closeModalJ() { document.getElementById('modal-jugador').classList.add('hidden'); }

    function openAddJugador(equipoId) {
      document.getElementById('modal-titulo').textContent = 'Agregar Jugador';
      document.getElementById('j-equipo-id').value   = equipoId;
      document.getElementById('j-jugador-id').value  = '';
      document.getElementById('j-nombre').value      = '';
      document.getElementById('j-activo').checked    = true;
      document.getElementById('j-activo-wrap').classList.add('hidden');
      document.getElementById('modal-jugador').classList.remove('hidden');
    }

    function openEditJugador(equipoId, jugadorId, nombre, activo) {
      document.getElementById('modal-titulo').textContent = 'Editar Jugador';
      document.getElementById('j-equipo-id').value   = equipoId;
      document.getElementById('j-jugador-id').value  = jugadorId;
      document.getElementById('j-nombre').value      = nombre;
      document.getElementById('j-activo').checked    = activo !== false;
      document.getElementById('j-activo-wrap').classList.remove('hidden');
      document.getElementById('modal-jugador').classList.remove('hidden');
    }

    function showMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `mt-3 text-sm text-center ${ok ? 'text-green-400' : 'text-red-400'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    async function renderEquipo(eq) {
      const jugadoresSnap = await db.collection('equipos').doc(eq.id)
        .collection('jugadores').orderBy('nombre').get();
      const jugadores = jugadoresSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const activos = jugadores.filter(j => j.activo !== false);

      const card = document.createElement('div');
      card.id = `card-${eq.id}`;
      card.className = 'bg-lfc-navy rounded-2xl p-4';
      card.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-white font-barlow font-bold text-2xl uppercase tracking-wide leading-none">${eq.nombre}</h3>
            <p class="text-lfc-slate text-xs mt-0.5">${activos.length} jugadores activos</p>
          </div>
          <div class="flex gap-2 items-center">
            <button onclick="toggleEquipo('${eq.id}', ${eq.activo})"
              class="text-xs ${eq.activo ? 'text-lfc-slate hover:text-red-400' : 'text-green-400 hover:text-green-300'} font-semibold uppercase transition">
              ${eq.activo ? 'Desactivar' : 'Activar'}
            </button>
          </div>
        </div>
        <div class="divide-y divide-white/10 mb-3" id="jugadores-${eq.id}">
          ${jugadores.map(j => `
            <div class="py-2 flex items-center justify-between ${j.activo === false ? 'opacity-40' : ''}">
              <span class="text-white text-sm">${j.nombre}</span>
              <button onclick="openEditJugador('${eq.id}','${j.id}','${j.nombre.replace(/'/g,"\\'")}',${j.activo !== false})"
                class="text-lfc-slate hover:text-white text-xs uppercase tracking-wide transition">
                Editar
              </button>
            </div>`).join('')}
          ${!jugadores.length ? '<p class="text-lfc-slate text-xs py-2">Sin jugadores aún.</p>' : ''}
        </div>
        <button onclick="openAddJugador('${eq.id}')"
          class="w-full py-2 border border-lfc-slate/30 rounded-xl text-lfc-slate hover:text-white hover:border-lfc-slate/60 text-sm font-semibold transition">
          + Agregar jugador
        </button>`;
      return card;
    }

    async function reloadEquipos() {
      const container = document.getElementById('equipos-container');
      container.innerHTML = '';
      const snap = await db.collection('equipos').get();
      const equipos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      equipos.sort((a, b) => a.nombre.localeCompare(b.nombre));
      for (const eq of equipos) {
        container.appendChild(await renderEquipo(eq));
      }
    }

    async function toggleEquipo(equipoId, activo) {
      await db.collection('equipos').doc(equipoId).update({ activo: !activo });
      await reloadEquipos();
    }

    requireAuth(async (user) => {
      renderHeader(document.getElementById('header-root'), user, 'Equipos');

      document.getElementById('loading-eq').classList.add('hidden');
      await reloadEquipos();

      // Seed inicial
      document.getElementById('btn-seed').addEventListener('click', async () => {
        const btn = document.getElementById('btn-seed');
        btn.disabled = true; btn.textContent = 'Inicializando…';

        try {
          const batch = db.batch();
          for (const eq of SEED_EQUIPOS) {
            batch.set(db.collection('equipos').doc(eq.id), {
              nombre: eq.nombre, activo: true
            }, { merge: true });
          }
          await batch.commit();

          // Sembrar jugadores de todos los equipos
          let total = 0;
          for (const eq of SEED_EQUIPOS) {
            const jugadores = SEED_JUGADORES[eq.id] || [];
            for (const nombre of jugadores) {
              const id = nombre.toLowerCase()
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
              await db.collection('equipos').doc(eq.id)
                .collection('jugadores').doc(id)
                .set({ nombre, activo: true }, { merge: true });
              total++;
            }
            showMsg('msg-seed', `Cargando ${eq.nombre}…`, true);
          }
          showMsg('msg-seed', `Listo: ${total} jugadores en ${SEED_EQUIPOS.length} equipos.`, true);
          await reloadEquipos();
        } catch (e) {
          showMsg('msg-seed', `Error: ${e.message}`, false);
        } finally {
          btn.disabled = false; btn.textContent = 'Inicializar Datos (Todos los equipos)';
        }
      });

      // Crear equipo
      document.getElementById('btn-crear-eq').addEventListener('click', async () => {
        const id     = document.getElementById('eq-id').value.trim().toLowerCase().replace(/\s+/g,'');
        const nombre = document.getElementById('eq-nombre').value.trim();
        if (!id || !nombre) { showMsg('msg-eq', 'Completa ID y nombre.', false); return; }
        try {
          await db.collection('equipos').doc(id).set({ nombre, activo: true });
          document.getElementById('eq-id').value = '';
          document.getElementById('eq-nombre').value = '';
          showMsg('msg-eq', `Equipo "${nombre}" creado.`, true);
          await reloadEquipos();
        } catch (e) {
          showMsg('msg-eq', `Error: ${e.message}`, false);
        }
      });

      // Guardar jugador (nuevo o editar)
      document.getElementById('btn-guardar-j').addEventListener('click', async () => {
        const equipoId  = document.getElementById('j-equipo-id').value;
        const jugadorId = document.getElementById('j-jugador-id').value;
        const nombre    = document.getElementById('j-nombre').value.trim();
        const activo    = document.getElementById('j-activo').checked;
        if (!nombre) { showToast('Ingresa el nombre del jugador.', 'error'); return; }

        const ref = jugadorId
          ? db.collection('equipos').doc(equipoId).collection('jugadores').doc(jugadorId)
          : db.collection('equipos').doc(equipoId).collection('jugadores').doc();

        await ref.set({ nombre, activo }, { merge: true });
        closeModalJ();
        showToast('Jugador guardado.', 'success');
        await reloadEquipos();
      });

    }, true); // solo admins
  </script>
</body>
</html>
