  const log = document.getElementById('log');
  function addLog(msg, color = 'text-lfc-slate') {
    const p = document.createElement('p');
    p.className = color;
    p.textContent = msg;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  async function migrar(equipo, btn) {
    btn.disabled = true;
    btn.textContent = `Migrando ${equipo.equipoNombre}…`;
    log.innerHTML = '';
    addLog(`Iniciando migración de ${equipo.equipoNombre}…`);

    let docsCreados = 0;
    try {
      for (let fi = 0; fi < equipo.fechas.length; fi++) {
        const fecha = equipo.fechas[fi];
        const registros = {};
        equipo.jugadores.forEach(j => {
          registros[j.id] = { nombre: j.nombre, estado: j.est[fi] };
        });
        await db.collection('asistencia').doc(`${equipo.equipoId}_${fecha}`).set({
          equipo: equipo.equipoId,
          equipoNombre: equipo.equipoNombre,
          fecha,
          registros,
          creadoPor: 'migracion-historica',
          ultimaEdicion: firebase.firestore.FieldValue.serverTimestamp(),
        });
        const presentes = equipo.jugadores.filter(j => j.est[fi] === 'asiste').length;
        addLog(`  ✓ ${fecha} — ${presentes}/${equipo.jugadores.length} presentes`, 'text-green-400');
        docsCreados++;
      }
      addLog(``, '');
      addLog(`✅ ${equipo.equipoNombre}: ${docsCreados} sesiones cargadas.`, 'text-green-400');
      btn.textContent = `✓ ${equipo.equipoNombre} completado`;
      btn.className = btn.className.replace('bg-lfc-red hover:bg-red-700', 'bg-green-700 cursor-default');
    } catch (e) {
      addLog(`❌ Error: ${e.message}`, 'text-red-400');
      btn.disabled = false;
      btn.textContent = `Reintentar ${equipo.equipoNombre}`;
    }
  }

  // Crear botones dinámicamente
  const contenedor = document.getElementById('botones');
  HISTORICOS.forEach(eq => {
    const btn = document.createElement('button');
    btn.className = 'w-full bg-lfc-red hover:bg-red-700 text-white font-barlow font-bold text-xl uppercase tracking-widest py-3 rounded-xl transition';
    btn.textContent = `Cargar ${eq.equipoNombre} (${eq.fechas.length} sesiones, ${eq.jugadores.length} jugadores)`;
    btn.addEventListener('click', () => migrar(eq, btn));
    contenedor.appendChild(btn);
  });
